<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TCPL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* Layout: sidebar theo 4 nhóm chức năng (desktop), thanh dưới + menu "Thêm" (mobile). Màn đọc hợp đồng: văn bản bên trái, bảng phân tích AI bên phải. */
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --surface2:#E8EDEA; --ink:#15211D; --muted:#586861; --line:#D6DED9;
  --accent:#0E6B5A; --accent-ink:#FFFFFF; --accent-soft:#DCEEE8;
  --warn:#8F5500; --warn-bg:#FBEBD0; --risk:#A8231C; --risk-bg:#FADCD9; --ok:#1D7048; --ok-bg:#D9EFE1; --mark:#FFE7A0;
  --font-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-display:'Newsreader',Georgia,'Times New Roman',serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1613; --surface:#16211D; --surface2:#1E2C27; --ink:#E5EEEA; --muted:#92A49C; --line:#2A3A34;
  --accent:#4FC3A8; --accent-ink:#06201A; --accent-soft:#1B3A32;
  --warn:#EAB454; --warn-bg:#3A2D12; --risk:#F28A82; --risk-bg:#3E1C19; --ok:#6FD39B; --ok-bg:#183626; --mark:#5A4A14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#16211D; --surface2:#1E2C27; --ink:#E5EEEA; --muted:#92A49C; --line:#2A3A34;
  --accent:#4FC3A8; --accent-ink:#06201A; --accent-soft:#1B3A32;
  --warn:#EAB454; --warn-bg:#3A2D12; --risk:#F28A82; --risk-bg:#3E1C19; --ok:#6FD39B; --ok-bg:#183626; --mark:#5A4A14; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 14.5px/1.55 var(--font-body);
  padding-block:0 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:28px;line-height:1.15} h2{font-size:21px} h3{font-size:17px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:232px minmax(0,1fr);gap:28px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);padding-block:16px;display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 32px);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:22px;font-weight:600}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.navg{display:flex;flex-direction:column;gap:2px}
.navg h4{margin:0 0 4px 10px;font:600 11px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:none;text-align:left;width:100%;color:var(--ink)}
.nav:hover{background:var(--surface2)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .badge{margin-left:auto}
.badge{min-width:20px;height:20px;border-radius:10px;padding:0 6px;background:var(--risk);color:#fff;font:600 11px/20px var(--font-body);text-align:center}
.main{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px}
.top .brand{display:none}
.gsearch{flex:1;min-width:0;position:relative}
.gsearch input{width:100%;padding:10px 12px 10px 38px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.gsearch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;flex:none}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#view{display:flex;flex-direction:column;gap:20px;padding-block:8px 8px;min-height:60vh}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pagehead p{color:var(--muted);margin-top:4px;max-width:62ch}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flat{background:transparent}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.row2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.pill.risk{background:var(--risk-bg);color:var(--risk)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{display:inline-flex;background:var(--surface2);border-radius:9px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:13px;font-weight:500;white-space:nowrap;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea,.toolbar input,.toolbar select{padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);width:100%}
.field textarea{resize:vertical;min-height:140px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1;min-width:200px;width:auto}
.toolbar select{width:auto}
.alertbar{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);background:var(--warn-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.alertbar svg{color:var(--warn);margin-top:2px}
.alertbar .grow{flex:1;min-width:0}
.summary{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--muted)}
.summary b{color:var(--ink);font-variant-numeric:tabular-nums}
/* list rows */
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.rowi{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.rowi:first-child{border-top:0}
.rowi:hover{background:var(--surface2)}
.rowi .t{font-weight:600;min-width:0} .rowi .t span{display:block;font-weight:400;color:var(--muted);font-size:13px}
.rowi .c{min-width:0;font-size:13.5px}
.rowi .c small{display:block;color:var(--muted);font-size:12px}
.rowi .num{font-variant-numeric:tabular-nums}
/* reader */
.reader{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:18px;align-items:start}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px clamp(16px,4vw,44px)}
.doc h1{text-align:center;font-size:21px;text-transform:uppercase;letter-spacing:.02em}
.doc .sub{text-align:center;color:var(--muted);font-size:13px;margin:4px 0 20px}
.doc .parties{margin-bottom:18px;color:var(--muted)}
.clause{padding:10px 12px;margin:0 -12px;border-radius:8px;font-family:var(--font-display);font-size:17px;line-height:1.65;transition:background .3s}
.clause h3{font:600 14px/1.4 var(--font-body);display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.clause.hi{background:var(--accent-soft)}
.clause.r-high{background:color-mix(in srgb,var(--risk-bg) 55%,transparent)}
.clause.r-med{background:color-mix(in srgb,var(--warn-bg) 55%,transparent)}
.term{background:var(--mark);border-radius:3px;padding:0 2px;cursor:help;border-bottom:1.5px dashed var(--warn)}
.hint{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);background:var(--surface2);border-radius:8px;padding:8px 12px;margin-bottom:14px}
.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);display:flex;flex-direction:column;gap:12px;min-width:0}
.panel .body{max-height:calc(100vh - 190px);overflow:auto;display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0}
.kv dt{color:var(--muted);font-size:13px} .kv dd{margin:0;font-weight:500;text-align:right}
.riskitem{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.riskitem:hover{border-color:var(--accent)}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
/* popover */
.pop{position:fixed;z-index:80;width:min(360px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:14px;display:flex;flex-direction:column;gap:10px;max-height:70vh;overflow:auto}
.pop blockquote{margin:0;padding:6px 10px;border-radius:6px;background:var(--mark);font-size:13px}
.law{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--accent);font-weight:600}
/* chat */
.chatwrap{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:420px}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:6px 2px}
.msg{max-width:min(680px,88%);display:flex;flex-direction:column;gap:8px}
.msg .bub{padding:11px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.msg.me{align-self:flex-end}
.msg.me .bub{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cite{display:inline-flex;gap:6px;align-items:center;padding:4px 9px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:500}
.typing span{display:inline-block;width:6px;height:6px;margin-right:3px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{display:flex;gap:8px;padding-top:10px}
.composer input{flex:1;min-width:0;padding:11px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
/* steps */
.step{display:grid;grid-template-columns:28px 1fr;gap:12px}
.step .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface);color:var(--accent-ink);padding:0}
.step.done .dot{background:var(--accent);border-color:var(--accent)}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
/* modal */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(5,12,10,.55);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;border:1px solid var(--line);width:min(560px,100%);max-height:88vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--bg)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100vw - 32px)}
.bottom{display:none}
.foot{color:var(--muted);font-size:12.5px;display:flex;gap:8px;align-items:flex-start;padding-top:8px}
.sample{font-size:12px;color:var(--muted)}
.preview{white-space:pre-wrap;font-family:var(--font-display);font-size:16px;line-height:1.6}
.sugg{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.sugg:first-child{border-top:0}
@media (max-width:1100px){
  .reader{grid-template-columns:minmax(0,1fr)}
  .panel{position:static}.panel .body{max-height:none}
  .row2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr);gap:0}
  .side{display:none}
  .top .brand{display:flex;font-size:19px}
  .top .brand-mark{width:28px;height:28px}
  .gsearch{display:none}
  .top{justify-content:space-between}
  .top .acts{display:flex;gap:8px}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 2px;color:var(--muted);border-radius:8px}
  .bottom button[aria-current="page"]{color:var(--accent);font-weight:600}
  body{padding-bottom:84px}
  .chatwrap{height:calc(100vh - 290px)}
}
@media (min-width:961px){.top .acts{display:flex;gap:8px}}
@media (max-width:720px){
  h1{font-size:24px}
  .alertbar{flex-wrap:wrap}.alertbar .grow{flex-basis:calc(100% - 40px)}
  .rowi{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px}
  .rowi .c.hide-m{display:none}
  .pop{left:0!important;right:0;top:auto!important;bottom:calc(66px + env(safe-area-inset-bottom,0px));margin:0 auto}
  .msg{max-width:94%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="bn"></span></div>
      <div class="gsearch"><svg class="i" viewBox="0 0 24 24"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M20 20l-4-4"/></svg>
        <input id="gs" type="search" placeholder="Tra cứu văn bản luật, số hiệu, từ khóa…" aria-label="Tra cứu nhanh"></div>
      <div class="acts">
        <button class="icon-btn" id="themeBtn" aria-label="Đổi giao diện sáng tối"></button>
        <div class="avatar" title="Tài khoản mẫu">ND</div>
      </div>
    </header>
    <main id="view"></main>
    <p class="foot" id="foot"></p>
  </div>
</div>
<nav class="bottom" id="bnav" aria-label="Điều hướng chính"></nav>
<div id="pop" class="pop" hidden></div>
<div id="modalRoot"></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
const BRAND='TCPL';
document.querySelectorAll('.bn').forEach(e=>e.textContent=BRAND);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P={home:'M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z',
file:'M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z M14 3v5h5 M9 13h6 M9 17h6',
pen:'M12 20h9 M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z',
spark:'M12 3v4 M12 17v4 M3 12h4 M17 12h4 M6 6l2.5 2.5 M15.5 15.5L18 18 M18 6l-2.5 2.5 M8.5 15.5L6 18',
chat:'M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z',
route:'M6 3v12 M6 15a3 3 0 1 0 0 6 3 3 0 0 0 0-6z M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M18 9v3a3 3 0 0 1-3 3H9',
lawyer:'M12 3v18 M5 21h14 M5 7h14 M5 7l-3 7a3 3 0 0 0 6 0z M19 7l-3 7a3 3 0 0 0 6 0z',
book:'M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z M6.5 17v4H20',
news:'M4 5h14v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z M18 9h2v10a2 2 0 0 1-2 2 M8 9h6 M8 13h6 M8 17h4',
camera:'M3 7h4l2-3h6l2 3h4v12H3z M12 11a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z',
bookmark:'M6 3h12v18l-6-4-6 4z',
clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 7v5l3 2',
bell:'M6 9a6 6 0 0 1 12 0c0 6 2.5 8 2.5 8h-17S6 15 6 9z M10 21h4',
search:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M20 20l-4-4',
upload:'M12 16V4 M7 9l5-5 5 5 M4 20h16',plus:'M12 5v14 M5 12h14',check:'M5 12l5 5 10-11',
alert:'M12 3l10 18H2z M12 10v5 M12 18v.5',send:'M4 12l16-8-6 17-3-7z',more:'M5 12h.01 M12 12h.01 M19 12h.01',
moon:'M20 14A8 8 0 1 1 10 4a6.5 6.5 0 0 0 10 10z',chev:'M9 6l6 6-6 6',back:'M15 6l-6 6 6 6',x:'M6 6l12 12 M18 6L6 18',
link:'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1 M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1',
shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',cal:'M4 6h16v14H4z M4 10h16 M8 3v4 M16 3v4',
pin:'M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z M12 7.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n]}"/></svg>`;

/* ---------- dữ liệu mẫu ---------- */
const today=new Date();today.setHours(0,0,0,0);
const addDays=n=>{const d=new Date(today);d.setDate(d.getDate()+n);return d};
const fmt=d=>d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'});
const daysLeft=c=>Math.round((c.end-today)/864e5);

const CLAUSES_RENT=c=>[

 {id:'d2',title:'Điều 2. Thời hạn thuê',risk:'med',riskTitle:'Tự động gia hạn',riskNote:'Hợp đồng tự gia hạn thêm 12 tháng nếu không bên nào báo trước 30 ngày. Bạn dễ bị ràng buộc thêm một năm mà không để ý.',text:`Thời hạn thuê là 12 tháng, từ ngày ${fmt(c.start)} đến hết ngày ${fmt(c.end)}. Hết hạn, nếu không bên nào thông báo bằng văn bản trước 30 ngày thì hợp đồng tự động gia hạn thêm 12 tháng.`,plain:'Nếu không muốn ở tiếp, bạn phải báo bằng văn bản trước ngày hết hạn ít nhất 30 ngày. Quên báo thì hợp đồng kéo dài thêm một năm.',law:'BLDS 2015, Điều 474',links:['d4','d7']},
 {id:'d3',title:'Điều 3. Giá thuê và thanh toán',risk:'high',riskTitle:'Phạt chậm trả cao',riskNote:'Phạt 0,5% mỗi ngày tương đương khoảng 15% mỗi tháng trên số tiền chậm, cao so với thông lệ. Nên đề nghị giảm hoặc cho thêm ngày ân hạn.',text:'Giá thuê là 6.500.000 đồng/tháng, thanh toán trước ngày 05 hằng tháng. Chậm quá 07 ngày, Bên B chịu phạt vi phạm 0,5%/ngày trên số tiền chậm trả.',plain:'Trả tiền thuê trước ngày 05. Trễ hơn 7 ngày thì mỗi ngày bị tính thêm 0,5% số tiền chưa trả.',law:'BLDS 2015, Điều 418',links:['d7']},

 {id:'d5',title:'Điều 5. Quyền và nghĩa vụ của Bên B',risk:'med',riskTitle:'Giá điện nước do Bên A quyết định',riskNote:'Đơn giá điện nước do Bên A thông báo, không gắn với giá nhà nước quy định. Nên ghi rõ cách tính và có công tơ riêng.',text:'Bên B không được cho thuê lại, không sửa chữa kết cấu nếu chưa có văn bản đồng ý của Bên A. Bên B tự chi trả tiền điện, nước theo đơn giá Bên A thông báo.',plain:'Bạn không được cho thuê lại hay sửa nhà nếu chưa có giấy đồng ý. Tiền điện nước tính theo giá chủ nhà thông báo.',law:'Luật Nhà ở 2023',links:[]},
 {id:'d6',title:'Điều 6. Sự kiện bất khả kháng',text:'Bên không thực hiện được nghĩa vụ do sự kiện bất khả kháng thì không phải chịu trách nhiệm, nhưng phải thông báo cho bên kia trong vòng 07 ngày.',plain:'Gặp thiên tai, dịch bệnh… bạn không bị coi là vi phạm, nhưng phải báo cho chủ nhà trong 7 ngày.',law:'BLDS 2015, Điều 156',links:[]},
 {id:'d7',title:'Điều 7. Đơn phương chấm dứt hợp đồng',risk:'high',riskTitle:'Bên A chấm dứt chỉ cần báo trước 7 ngày',riskNote:'Bên A được chấm dứt bất cứ lúc nào, báo trước 7 ngày, không nêu bồi thường. Bên B thì mất cọc. Điều khoản lệch hẳn về phía Bên A.',text:'Bên A có quyền đơn phương chấm dứt hợp đồng vào bất kỳ thời điểm nào bằng cách thông báo cho Bên B trước 07 ngày. Bên B muốn chấm dứt trước hạn phải thông báo trước 30 ngày và chịu mất tiền cọc theo Điều 4.',plain:'Chủ nhà có thể yêu cầu bạn dọn đi chỉ sau 7 ngày. Bạn muốn đi thì phải báo trước 30 ngày và mất cọc.',law:'BLDS 2015, Điều 428',links:['d4','d2']},

  const cl=c.clauses.find(k=>k.id===cid);

   <div class="chips"><button class="btn sm primary" data-act="askSel" data-q="${esc(quote.slice(0,120))}">${ic('chat')}Hỏi tiếp</button><button class="btn sm" data-act="saveSel" data-q="${esc(quote.slice(0,60))}">${ic('bookmark')}Lưu</button></div>`;

function onSelect(){
  setTimeout(()=>{
    if(S.view!=='reader')return;

  const fields=[...new Set(docsDb.map(d=>d.field))];
  const seg=`<div class="seg" role="tablist"><button role="tab" aria-selected="${S.dtab==='search'}" data-act="dtab" data-k="search">Tra cứu</button><button role="tab" aria-selected="${S.dtab==='new'}" data-act="dtab" data-k="new">Mới ban hành</button></div>`;
  if(S.dtab==='new')return `${head('Tra cứu văn bản','Văn bản mới được đối chiếu với từng điều khoản trong hợp đồng của bạn.',seg)}<div class="stack">${updates.map(u=>`<div class="card stack"><div class="between"><div class="chips">${pill(u.kind,'acc')}${u.affects.length?pill('Ảnh hưởng hợp đồng của bạn','risk'):pill('Chưa ảnh hưởng hợp đồng nào')}</div><span class="muted small">${fmt(u.date)}</span></div><b>${esc(u.title)}</b>${u.affects.map(a=>{const c=contracts.find(x=>x.id===a.c);return `<div class="alertbar" style="padding:10px 12px">${ic('alert')}<div class="grow small"><b>${esc(c.name)}</b>, ${c.clauses.find(k=>k.id===a.d).title}. ${esc(a.note)}</div><button class="btn sm" data-act="openAlert" data-c="${a.c}">Xem</button></div>`}).join('')}</div>`).join('')}</div>`;
  return `${head('Tra cứu văn bản','Tìm luật, nghị định, thông tư theo từ khóa, số hiệu, lĩnh vực và tình trạng hiệu lực.',seg)}
  <div class="toolbar"><input type="search" id="dq" placeholder="Từ khóa hoặc số hiệu, ví dụ 91/2015/QH13" value="${esc(S.dq)}" aria-label="Từ khóa">
   <select id="dtype" aria-label="Loại văn bản"><option value="">Mọi loại</option><option ${S.dtype==='Luật'?'selected':''}>Luật</option><option ${S.dtype==='Nghị định'?'selected':''}>Nghị định</option></select>
   <select id="dfield" aria-label="Lĩnh vực"><option value="">Mọi lĩnh vực</option>${fields.map(f=>`<option ${S.dfield===f?'selected':''}>${f}</option>`).join('')}</select>
   <select id="dstat" aria-label="Hiệu lực"><option value="">Mọi tình trạng</option><option value="ok" ${S.dstat==='ok'?'selected':''}>Còn hiệu lực</option><option value="off" ${S.dstat==='off'?'selected':''}>Hết hiệu lực</option></select></div>
  <p class="muted small">${list.length} kết quả</p>
  ${list.length?`<div class="rows">${list.map(d=>`<button class="rowi" style="grid-template-columns:minmax(0,1fr) auto" data-act="openDoc" data-d="${d.id}"><div class="t">${esc(d.name)}<span>${d.no} · ${d.type} · ${d.field} · hiệu lực từ ${d.from}</span></div>${pill(statusDoc[d.status][0],statusDoc[d.status][1])}</button>`).join('')}</div>`:`<div class="card"><b>Không tìm thấy văn bản</b><p class="muted">Thử từ khóa ngắn hơn hoặc bỏ bớt bộ lọc.</p></div>`}`;
}
function openDoc(id){const d=docsDb.find(x=>x.id===id);const sv=S.saved.includes(id);log('Xem: '+d.name,'docs');
  modal(`<div class="between"><div class="chips">${pill(d.type,'acc')}${pill(statusDoc[d.status][0],statusDoc[d.status][1])}</div><button class="icon-btn" data-act="closeModal" aria-label="Đóng">${ic('x')}</button></div><h2>${esc(d.name)}</h2>
  <dl class="kv"><dt>Số hiệu</dt><dd>${d.no}</dd><dt>Lĩnh vực</dt><dd>${d.field}</dd><dt>Hiệu lực từ</dt><dd>${d.from}</dd></dl>
  ${d.status==='off'?`<div class="alertbar">${ic('alert')}<div class="grow small">Văn bản này đã hết hiệu lực. Kiểm tra văn bản thay thế trước khi áp dụng.</div></div>`:''}
  <div class="chips"><button class="btn primary" data-act="saveDoc" data-d="${id}">${ic('bookmark')}${sv?'Bỏ lưu':'Lưu tài liệu'}</button><button class="btn" data-act="askDoc" data-q="${esc(d.name)}">${ic('chat')}Hỏi AI về văn bản này</button></div>
  <p class="sample">Nội dung đầy đủ sẽ lấy từ Cơ sở dữ liệu quốc gia về văn bản pháp luật.</p>`);}

/* ---------- tin tức, tiện ích ---------- */
function vNews(){const cats=[...new Set(news.map(n=>n.cat))];const l=news.filter(n=>!S.nfilter||n.cat===S.nfilter);
  return `${head('Tin tức pháp luật','Tin ngắn, chính xác, dễ hiểu. Nội dung dưới đây là tiêu đề mẫu cho giao diện.')}
  <div class="chips"><button class="chip" aria-pressed="${!S.nfilter}" data-act="nf" data-k="">Tất cả</button>${cats.map(c=>`<button class="chip" aria-pressed="${S.nfilter===c}" data-act="nf" data-k="${c}">${c}</button>`).join('')}</div>
  <div class="cards">${l.map(n=>`<article class="card stack">${pill(n.cat,'acc')}<h3>${n.t}</h3><p class="muted small" style="margin-top:auto">${fmt(n.d)} · ${n.r}</p></article>`).join('')}</div>`}
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
function vFines(){const f=S.fine;
  return `${head('Tra cứu phạt nguội','Nhập biển số để kiểm tra vi phạm giao thông qua hình ảnh.')}
  <div class="row2" style="grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)"><form class="card stack" id="fineForm"><div class="field"><label for="plate">Biển số xe</label><input id="plate" placeholder="Ví dụ 37A-123.45" value="${esc(f?f.plate:'')}" autocomplete="off"></div>
   <div class="field"><label for="vtype">Loại phương tiện</label><select id="vtype"><option>Ô tô</option><option>Xe máy</option></select></div><div id="fineErr" class="small" style="color:var(--risk)" role="alert"></div><button class="btn primary">${ic('search')}Tra cứu</button><p class="sample">Bản giao diện chưa kết nối cổng tra cứu của cơ quan chức năng. Kết quả chỉ để minh họa.</p></form>
   <div>${!f?`<div class="card muted">Kết quả sẽ hiện ở đây.</div>`:f.n?`<div class="card stack"><div class="between"><b>${esc(f.plate)}</b>${pill(f.n+' vi phạm chưa xử lý','risk')}</div>${Array.from({length:f.n}).map((_,i)=>`<div class="alertbar"><div class="grow"><b>Không chấp hành tín hiệu đèn giao thông</b><p class="small">Thời gian: ${fmt(addDays(-8-i*5))} · Địa điểm: Ngã tư Lê Mao, TP. Vinh</p><p class="small">Mức phạt dự kiến: ${(f.p+i*1)*1} triệu đồng</p></div></div>`).join('')}<p class="small muted">Xem căn cứ xử phạt trong Nghị định 168/2024/NĐ-CP ở mục Tra cứu văn bản.</p></div>`:`<div class="card stack">${pill('Chưa phát hiện vi phạm','ok')}<p>Biển số <b>${esc(f.plate)}</b> chưa có vi phạm nào được ghi nhận.</p></div>`}</div></div>`}
function vSaved(){const docs=S.saved.map(id=>docsDb.find(d=>d.id===id)).filter(Boolean);const q=S.savedQ||[];
  return `${head('Tài liệu đã lưu','Văn bản và đoạn hợp đồng bạn đánh dấu để xem lại.')}
  <h2>Văn bản pháp luật</h2>${docs.length?`<div class="rows">${docs.map(d=>`<button class="rowi" style="grid-template-columns:minmax(0,1fr) auto" data-act="openDoc" data-d="${d.id}"><div class="t">${esc(d.name)}<span>${d.no}</span></div>${pill(statusDoc[d.status][0],statusDoc[d.status][1])}</button>`).join('')}</div>`:`<div class="card muted">Chưa lưu văn bản nào. Mở một văn bản và chọn Lưu tài liệu.</div>`}
  <h2>Đoạn trong hợp đồng</h2>${q.length?`<div class="rows">${q.map(x=>`<div class="rowi" style="grid-template-columns:minmax(0,1fr)"><div class="t" style="font-weight:500">${esc(x)}</div></div>`).join('')}</div>`:`<div class="card muted">Bôi đen một đoạn trong hợp đồng rồi chọn Lưu để thêm vào đây.</div>`}`}
function vHistory(){return `${head('Lịch sử','Tra cứu và hoạt động gần đây của bạn.')}<div class="rows">${S.history.map(h=>`<button class="rowi" style="grid-template-columns:minmax(0,1fr) auto" data-go="${h.w}"><div class="t" style="font-weight:500">${esc(h.t)}</div><span class="muted small">${ago(h.a)}</span></button>`).join('')}</div>`}

/* ---------- tải hợp đồng lên ---------- */
function uploadModal(){modal(`<div class="between"><h2>Tải hợp đồng lên</h2><button class="icon-btn" data-act="closeModal" aria-label="Đóng">${ic('x')}</button></div>
 <div class="drop" id="drop">${ic('upload')}<b>Kéo thả hoặc chọn tệp</b><span class="muted small">Ảnh chụp, PDF hoặc Word</span><label class="btn" for="fileIn" style="cursor:pointer">Chọn tệp</label><input type="file" id="fileIn" accept=".pdf,.doc,.docx,image/*" hidden></div>
 <button class="btn" data-act="useSample">Dùng hợp đồng thuê nhà mẫu</button>`)}
function process(name){
  modal(`<h2>Đang xử lý</h2><div class="stack" id="proc">${['Đọc nội dung hợp đồng','Nhận diện điều khoản và thuật ngữ','Đối chiếu với văn bản pháp luật hiện hành'].map((s,i)=>`<div class="between" style="justify-content:flex-start;gap:10px" id="ps${i}"><span class="typing"><span></span><span></span><span></span></span><span>${s}</span></div>`).join('')}</div>`);
  [0,1,2].forEach(i=>setTimeout(()=>{const e=$('#ps'+i);if(e)e.firstElementChild.outerHTML=`<span style="color:var(--ok)">${ic('check')}</span>`},500+i*600));
  setTimeout(()=>{const n=contracts.length+1;const c=mk({id:'c'+n,name:name,type:'Thuê nhà',party:'Bên cho thuê (đang đọc)',value:'6.500.000 đ/tháng',start:addDays(-1),end:addDays(364)});c.clauses=CLAUSES_RENT(c);contracts.unshift(c);log('Tải lên: '+name,'contracts');closeModal();S.cid=c.id;S.rtab='sum';go('reader');toast('Đã đọc xong hợp đồng. Nội dung hiển thị là bản mẫu.')},2500)}

/* ---------- sự kiện ---------- */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){closeModal();go(g.dataset.go);return}
  const t=e.target.closest('.term');if(t&&S.view==='reader'){const r=t.getBoundingClientRect();showPop(r,t.textContent,t.dataset.term,t.closest('[data-clause]'));return}
  const a=e.target.closest('[data-act]');
  if(!a){if(!e.target.closest('#pop')&&!e.target.closest('.doc'))hidePop();return}
  const d=a.dataset,act=d.act;
  if(act==='closeModal'){if(e.target===a||a.tagName==='BUTTON')closeModal();return}
  switch(act){
   case 'more':modal(`<div class="between"><h2>Thêm</h2><button class="icon-btn" data-act="closeModal" aria-label="Đóng">${ic('x')}</button></div><div class="stack">${[['templates','Mẫu và soạn thảo','pen'],['tos','Tóm tắt điều khoản','spark'],['lawyers','Luật sư','lawyer'],['docs','Tra cứu văn bản','book'],['news','Tin tức pháp luật','news'],['fines','Tra cứu phạt nguội','camera'],['saved','Tài liệu đã lưu','bookmark'],['history','Lịch sử','clock']].map(([id,l,i])=>`<button class="btn" style="justify-content:flex-start" data-go="${id}">${ic(i)}${l}</button>`).join('')}</div>`);break;
   case 'upload':uploadModal();break;
   case 'useSample':process('Hợp đồng thuê nhà (bản mẫu)');break;
   case 'openC':S.cid=d.c;S.rtab='sum';log('Mở '+contracts.find(c=>c.id===d.c).name,'contracts');go('reader');break;
   case 'openAlert':S.cid=d.c;S.rtab='law';go('reader');break;
   case 'openUpdates':go('docs',{dtab:'new'});break;
   case 'cflt':S.cflt=d.k;render();break;
   case 'rtab':S.rtab=d.k;render();break;
   case 'goClause':if(S.view==='reader')flash(d.k);break;
   case 'hidePop':hidePop();break;
   case 'askSel':hidePop();S.view='chat';render();ask('Giải thích giúp tôi đoạn này: '+d.q);history.replaceState(null,'','#chat');break;
   case 'saveSel':S.savedQ=[d.q,...(S.savedQ||[])];toast('Đã lưu đoạn đã chọn');hidePop();break;
   case 'useT':S.tid=d.t;go('draft');break;
   case 'togS':{const t=templates.find(x=>x.id===S.tid);const l=S.textra[t.id]=S.textra[t.id]||[];const i=+d.i;const k=l.indexOf(i);k<0?l.push(i):l.splice(k,1);render();break}
   case 'saveDraft':{const t=templates.find(x=>x.id===S.tid);const v=tvals(t);const n=contracts.length+1;const c=mk({id:'c'+n,name:t.name+' (bản nháp)',type:t.name.replace('Hợp đồng ','').replace(/^./,m=>m.toUpperCase()),party:v.b,value:v.price?money(v.price)+' đ':'',start:addDays(0),end:addDays(364)});c.clauses=CLAUSES_RENT(c);contracts.unshift(c);log('Lưu bản nháp '+t.name,'contracts');toast('Đã lưu vào Hợp đồng của tôi');go('contracts');break}
   case 'tosSample':S.tosText=TOS_SAMPLE;render();break;
   case 'tosRun':{const v=$('#tosIn').value.trim();S.tosText=$('#tosIn').value;if(v.length<20){$('#tosErr').textContent='Hãy dán nội dung điều khoản (ít nhất vài câu) để tóm tắt.';break}S.tosBusy=true;S.tosRes=null;render();setTimeout(()=>{S.tosBusy=false;S.tosRes=true;if(S.view==='tos')render()},1100);break}
   case 'ask':ask(d.q);break;
   case 'askProc':S.view='chat';render();ask('Thủ tục '+d.q+' cần những gì?');history.replaceState(null,'','#chat');break;
   case 'askDoc':closeModal();S.view='chat';render();ask('Tóm tắt nội dung chính của '+d.q);history.replaceState(null,'','#chat');break;
   case 'selP':S.pid=d.p;render();break;
   case 'togP':{const l=S.pdone[S.pid]=S.pdone[S.pid]||[];const i=+d.i;const k=l.indexOf(i);k<0?l.push(i):l.splice(k,1);render();break}
   case 'book':S.booked[d.l]=d.s;log('Đặt lịch '+lawyers.find(l=>l.id===d.l).name+', '+d.s,'lawyers');toast('Đã đặt lịch: '+d.s);render();break;
   case 'dtab':S.dtab=d.k;render();break;
   case 'openDoc':openDoc(d.d);break;
   case 'saveDoc':{const i=S.saved.indexOf(d.d);i<0?S.saved.push(d.d):S.saved.splice(i,1);toast(i<0?'Đã lưu tài liệu':'Đã bỏ lưu');openDoc(d.d);break}
   case 'nf':S.nfilter=d.k;render();break;
  }
});
document.addEventListener('input',e=>{
  const i=e.target;
  if(i.id==='cq'){S.cq=i.value;const p=i.selectionStart;render();const n=$('#cq');n.focus();n.setSelectionRange(p,p)}
  if(i.id==='dq'){S.dq=i.value;const p=i.selectionStart;render();const n=$('#dq');n.focus();n.setSelectionRange(p,p)}
  if(i.dataset.field){const t=templates.find(x=>x.id===S.tid);tvals(t)[i.dataset.field]=i.value;$('#prev').textContent=draftText(t)}
});
document.addEventListener('change',e=>{
  const i=e.target;const m={ctype:'ctype',dtype:'dtype',dfield:'dfield',dstat:'dstat',lf:'lf',la:'la'};
  if(m[i.id]){S[m[i.id]]=i.value;render()}
  if(i.id==='fileIn'&&i.files[0])process(i.files[0].name.replace(/\.[^.]+$/,''));
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='chatForm'){const v=$('#chatIn').value;ask(v)}
  if(e.target.id==='fineForm'){const p=$('#plate').value.trim().toUpperCase();if(!/^\d{2}[A-Z]{1,2}[-\s]?\d{3,5}(\.\d{2})?$/.test(p)){$('#fineErr').textContent='Biển số chưa đúng định dạng. Ví dụ: 37A-123.45';return}
    const h=hash(p);S.fine={plate:p,n:h%3===0?0:(h%2)+1,p:4};log('Tra cứu phạt nguội: '+p,'fines');render()}
  if(e.target.id==='gs'){}
});
$('#gs').addEventListener('keydown',e=>{if(e.key==='Enter'){S.dq=e.target.value;S.dtab='search';e.target.value='';go('docs')}});
document.addEventListener('dragover',e=>{const d=e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest('#drop');if(d){e.preventDefault();const f=e.dataTransfer.files[0];if(f)process(f.name.replace(/\.[^.]+$/,''))}});
document.addEventListener('mouseup',onSelect);document.addEventListener('touchend',onSelect);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){hidePop();closeModal()}});
$('#themeBtn').addEventListener('click',()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'});
(function init(){try{const h=location.hash.slice(1);if(TITLES[h]&&!['reader','draft'].includes(h))S.view=h}catch(e){}render()})();
</script>

</body></html>
